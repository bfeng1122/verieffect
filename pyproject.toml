[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof"
version = "0.1.0"
description = "Deterministic verification for AI agent work — signed, tamper-evident receipts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bing Feng" }]
keywords = ["ai", "agents", "verification", "receipts", "ed25519", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=41.0",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/bfeng1122/agentproof"
Repository = "https://github.com/bfeng1122/agentproof"

[project.scripts]
agentproof = "agentproof.cli:main"

[tool.setuptools]
packages = ["agentproof"]
