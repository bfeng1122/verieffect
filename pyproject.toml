[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verieffect"
version = "0.1.0a1"
description = "Independent deterministic verification for AI agents — signed, offline-verifiable receipts"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Bing Feng" }]
keywords = ["ai", "agents", "verification", "receipts", "ed25519", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "cryptography>=50.0.2",
    "requests>=2.34.2",
]

[project.urls]
Homepage = "https://github.com/bfeng1122/verieffect"
Repository = "https://github.com/bfeng1122/verieffect"

[project.scripts]
verieffect = "verieffect.cli:main"

[tool.setuptools]
packages = ["verieffect"]
